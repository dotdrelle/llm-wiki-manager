# agents.docker-compose.yml — external agent stack
#
# Starts cme and documents as workspace-agnostic global services.
# The connectors service is opt-in with CONNECTORS_ENABLED=true; wiki-workspace
# translates that setting to the internal Compose profile.
# All workspace paths are resolved at tool-call time via the `workspace` param.
#
# Required:
#   WORKSPACES_ROOT   — path to the directory containing all workspace folders
#
# Optional (defaults shown):
#   AGENTS_DATA_DIR        — persistent state for stateful agents (default: ./.agents-data)
#   CME_MCP_PORT           — 3336
#   DOCUMENTS_MCP_PORT     — 3337
#   CME_MCP_AUTH_TOKEN     — bearer token for cme agent (empty = no auth)
#   DOCUMENTS_MCP_AUTH_TOKEN — bearer token for documents agent (empty = no auth)
#   CONNECTORS_MCP_PORT       — 3338
#   CONNECTORS_MCP_AUTH_TOKEN — bearer token for connectors MCP
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET — OAuth application
#   GOOGLE_OAUTH_CALLBACK_URL — exact public post-proxy callback URL
#   OAUTH_STATE_SECRET / OAUTH_START_TOKEN — distinct 32+ byte secrets
#   CONNECTORS_SEND_ENABLED — true; set to false to disable outbound email entirely
#   CONNECTORS_SEND_ALLOWED_RECIPIENTS — comma-separated addresses or @domain suffixes
#   DOCUMENT_LLM_BASE_URL  — https://albert.api.etalab.gouv.fr/v1
#   DOCUMENT_LLM_MODEL     — lightonai/LightOnOCR-2-1B
#   DOCUMENT_LLM_API_KEY   — OpenAI/OpenAI-compatible API key for document OCR
#   DOCUMENT_LLM_TIMEOUT_SECONDS — 120
#
# Set these variables in a .env file at the directory where you run wiki-workspace,
# or export them in your shell before running wiki-workspace agents up.
#
# TLS (optional, cme + documents share the same cert):
#   Set MCP_SSL_CERTFILE=/certs/server.crt and MCP_SSL_KEYFILE=/certs/server.key,
#   place the cert files in AGENTS_DATA_DIR/certs/, and uncomment the TLS lines below.
#
# Usage (via wiki-workspace):
#   wiki-workspace agents up
#   wiki-workspace agents down
#   wiki-workspace agents logs
#   wiki-workspace agents pull
#
# Or directly:
#   WORKSPACES_ROOT=/path/to/workspaces docker compose -f agents.docker-compose.yml up -d

services:

  cme:
    image: dotdrelle/agent-cme:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${CME_MCP_PORT:-3336}:8080"
    environment:
      - MCP_AUTH_TOKEN=${CME_MCP_AUTH_TOKEN:-}
      - WORKSPACES_ROOT=/workspaces
      # HTTPS — uncomment and place cert files in AGENTS_DATA_DIR/certs/
      #- MCP_SSL_CERTFILE=/certs/server.crt
      #- MCP_SSL_KEYFILE=/certs/server.key
    volumes:
      - ${AGENTS_DATA_DIR:-./.agents-data}/cme:/data
      - ${WORKSPACES_ROOT:?Set WORKSPACES_ROOT to the directory containing all workspace folders}:/workspaces
      #- ${AGENTS_DATA_DIR:-./.agents-data}/certs:/certs:ro
    restart: unless-stopped

  documents:
    image: dotdrelle/agent-wiki-documents:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${DOCUMENTS_MCP_PORT:-3337}:8080"
    environment:
      - MCP_AUTH_TOKEN=${DOCUMENTS_MCP_AUTH_TOKEN:-}
      - DOCUMENT_INPUT_DIR=/documents/input
      - DOCUMENT_OUTPUT_DIR=/documents/output
      - WORKSPACES_ROOT=/workspaces
      - DOCUMENT_MAX_UPLOAD_BYTES=${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
      # Deliberately empty defaults: the .env is the only source. A hardcoded
      # default here sent every deployment to a provider the operator never
      # chose and could not see, since the keys ship commented. An empty value
      # also overrides the image's own ENV fallback, so nothing is called until
      # the operator opts in. The agent already disables LLM OCR when the key or
      # the model is unset, so this degrades cleanly rather than failing.
      - DOCUMENT_LLM_BASE_URL=${DOCUMENT_LLM_BASE_URL:-}
      - DOCUMENT_LLM_MODEL=${DOCUMENT_LLM_MODEL:-}
      - DOCUMENT_LLM_API_KEY=${DOCUMENT_LLM_API_KEY:-}
      - DOCUMENT_LLM_TIMEOUT_SECONDS=${DOCUMENT_LLM_TIMEOUT_SECONDS:-120}
      # HTTPS — uncomment and place cert files in AGENTS_DATA_DIR/certs/
      #- MCP_SSL_CERTFILE=/certs/server.crt
      #- MCP_SSL_KEYFILE=/certs/server.key
    volumes:
      - ${AGENTS_DATA_DIR:-./.agents-data}/documents/input:/documents/input
      - ${AGENTS_DATA_DIR:-./.agents-data}/documents/output:/documents/output
      - ${WORKSPACES_ROOT:?Set WORKSPACES_ROOT to the directory containing all workspace folders}:/workspaces
      #- ${AGENTS_DATA_DIR:-./.agents-data}/certs:/certs:ro
    restart: unless-stopped

  connectors:
    profiles: [connectors]
    # Local iteration: build the image from the connectors repo instead of
    # pulling the published tag. `image:` is kept so the build is tagged with the
    # same name; restore image-only before publishing a release.
    build:
      context: ../agent-external/agent-connectors
      dockerfile: Dockerfile
      args:
        # Without these the ARGs stay unset and the image ships empty
        # WIKILLM_GOOGLE_OAUTH_* values, so the container ends up with no Google
        # client at all. `wiki-workspace agents up` exports them from the
        # connectors repo's .env.build.local before invoking Compose.
        # Deliberately value-less: Compose then forwards each host variable only
        # when it is defined. Never write `${VAR:-}` here — an empty
        # --build-arg pins the ARG to the empty string.
        WIKILLM_GOOGLE_OAUTH_CLIENT_ID:
        WIKILLM_GOOGLE_OAUTH_CLIENT_SECRET:
    image: dotdrelle/agent-connectors:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${CONNECTORS_MCP_PORT:-3338}:3338"
    environment:
      - CONNECTORS_PORT=3338
      - MCP_AUTH_TOKEN=${CONNECTORS_MCP_AUTH_TOKEN:-}
      - WORKSPACES_ROOT=/workspaces
      - AGENT_DATA_DIR=/data
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_CALLBACK_URL=${GOOGLE_OAUTH_CALLBACK_URL:-}
      - OAUTH_STATE_SECRET=${OAUTH_STATE_SECRET:-}
      - OAUTH_START_TOKEN=${OAUTH_START_TOKEN:-}
      - OAUTH_STATE_TTL_SECONDS=${OAUTH_STATE_TTL_SECONDS:-600}
      - CONNECTORS_RECOMMENDED_CONCURRENCY=${CONNECTORS_RECOMMENDED_CONCURRENCY:-2}
      - CONNECTORS_MAX_CONCURRENCY=${CONNECTORS_MAX_CONCURRENCY:-4}
      - CONNECTORS_SEND_ENABLED=${CONNECTORS_SEND_ENABLED:-true}
      - CONNECTORS_SEND_ALLOWED_RECIPIENTS=${CONNECTORS_SEND_ALLOWED_RECIPIENTS:-}
      - CONNECTORS_SEND_MAX_RECIPIENTS=${CONNECTORS_SEND_MAX_RECIPIENTS:-25}
      - CONNECTORS_SEND_MAX_BODY_BYTES=${CONNECTORS_SEND_MAX_BODY_BYTES:-262144}
      - NODE_USE_ENV_PROXY=${NODE_USE_ENV_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    volumes:
      - ${AGENTS_DATA_DIR:-./.agents-data}/connectors:/data
      - ${WORKSPACES_ROOT:?Set WORKSPACES_ROOT to the directory containing all workspace folders}:/workspaces
    restart: unless-stopped
