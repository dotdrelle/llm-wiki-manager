# docker-compose.yml — llm-wiki-manager cockpit stack
#
# This compose file is driven by ./wiki-workspace. It can run:
#   - one llm-wiki serve + mcp-http + production MCP set per configured workspace
#
# Typical usage:
#   ./wiki-workspace config <workspace> [path]
#   ./wiki-workspace up <workspace>
#   ./wiki-workspace wiki <workspace> doctor
#   ./wiki-workspace wiki <workspace> ingest
#
# Workspace UI / MCP endpoints use the ports declared in workspaces/<name>/.env.
# External MCP endpoints are declared in ./mcp.endpoints.json.

services:

  # ── llm-wiki ──────────────────────────────────────────────────────────────

  wiki:
    image: dotdrelle/llm-wiki:latest
    profiles: [cli]
    volumes:
      # Compose interpolates all services before applying profiles, so this
      # cannot be a required variable without breaking cli-only commands.
      - ${WIKI_WORKSPACE_PATH:-/tmp/llm-wiki-workspace-not-set}:/workspace
    environment:
      - WIKI_WORKSPACE_PATH=/workspace
      - WIKI_CONFIG_PATH=${WIKI_CONFIG_PATH:-}
    extra_hosts:
      - host.docker.internal:host-gateway

  serve:
    image: dotdrelle/llm-wiki:latest
    labels:
      wiki-manager.description: "Workspace web UI and local wiki browser."
    command: serve --port 3000
    stop_grace_period: 10s
    volumes:
      - ${WIKI_WORKSPACE_PATH:-/tmp/llm-wiki-workspace-not-set}:/workspace
      # Absolute path to the running instance's endpoints file (set by the
      # manager to managerStateDir/mcp.endpoints.json). Falls back to the
      # package-relative file only when launched without the manager.
      - ${WIKI_MANAGER_MCP_ENDPOINTS_FILE:-./mcp.endpoints.json}:/mcp.endpoints.json:ro
      - ${AGENTS_DATA_DIR:-./.agents-data}/documents/input:/documents/input
      - ${AGENTS_DATA_DIR:-./.agents-data}/documents/uploads:/documents/uploads
      # TLS certificates — uncomment if WIKI_SERVE_TLS_CERT_PATH is set
      #- ${WIKI_SERVE_CERTS_DIR:-./certs}:/certs:ro
    environment:
      - WIKI_WORKSPACE_PATH=/workspace
      # Every variable below is written as ${VAR:-default}, never as a bare
      # `- VAR` passthrough. The bare form makes Compose emit
      # `The "VAR" variable is not set. Defaulting to a blank string.` on stderr
      # for any key the operator has not written in a .env — the ports and
      # tokens shipped as commented placeholders in .env.example. The warning is
      # noise that surfaces in the ShellUI as if it were a failure.
      - WIKI_CONFIG_PATH=${WIKI_CONFIG_PATH:-}
      - WIKI_MCP_HTTP_PORT=${WIKI_MCP_PORT:-3101}
      - WIKI_MCP_AUTH_TOKEN=${WIKI_MCP_AUTH_TOKEN:-}
      - PRODUCTION_MCP_AUTH_TOKEN=${PRODUCTION_MCP_AUTH_TOKEN:-}
      - PRODUCTION_MCP_PORT=${PRODUCTION_MCP_PORT:-3102}
      - CME_MCP_PORT=${CME_MCP_PORT:-3336}
      - DOCUMENTS_MCP_PORT=${DOCUMENTS_MCP_PORT:-3337}
      - CME_MCP_AUTH_TOKEN=${CME_MCP_AUTH_TOKEN:-}
      - DOCUMENTS_MCP_AUTH_TOKEN=${DOCUMENTS_MCP_AUTH_TOKEN:-}
      # Connectors MCP: the serve panel resolves ${CONNECTORS_MCP_AUTH_TOKEN} in
      # /mcp.endpoints.json from process.env only, so it must be forwarded here
      # (symmetric with cme/documents) or the panel sends an empty Bearer → 401.
      - CONNECTORS_MCP_PORT=${CONNECTORS_MCP_PORT:-3338}
      - CONNECTORS_MCP_AUTH_TOKEN=${CONNECTORS_MCP_AUTH_TOKEN:-}
      - CONNECTORS_OAUTH_START_TOKEN=${OAUTH_START_TOKEN:-}
      - WORKSPACE_NAME=${WORKSPACE_NAME:-}
      - DOCUMENT_INPUT_DIR=/documents/input
      - DOCUMENT_UPLOADS_DIR=/documents/uploads
      - DOCUMENT_MAX_UPLOAD_BYTES=${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
      - WIKI_MCP_PROXY_URL=http://host.docker.internal:${WIKI_MCP_PORT:-3101}/mcp
      - PRODUCTION_MCP_PROXY_URL=http://host.docker.internal:${PRODUCTION_MCP_PORT:-3102}/mcp/
      - WIKI_MANAGER_RUNTIME_URL=http://host.docker.internal:${WIKI_MANAGER_RUNTIME_PORT:-7788}
      - WIKI_MANAGER_RUNTIME_TOKEN=${WIKI_MANAGER_RUNTIME_TOKEN:-}
      - CONNECTORS_AGENT_URL=http://host.docker.internal:${CONNECTORS_MCP_PORT:-3338}
      # HTTPS — set paths inside the container (e.g. /certs/server.crt) and uncomment the volume above
      #- WIKI_SERVE_TLS_CERT_PATH=/certs/server.crt
      #- WIKI_SERVE_TLS_KEY_PATH=/certs/server.key
      #- WIKI_SERVE_TLS_CA_PATH=/certs/ca.crt
    ports:
      - '${WIKI_SERVE_PORT:-3100}:3000'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  mcp-http:
    image: dotdrelle/llm-wiki:latest
    labels:
      wiki-manager.description: "llm-wiki MCP HTTP server for wiki tools."
    command: mcp-http --host 0.0.0.0 --port 3333 --path /mcp
    volumes:
      - ${WIKI_WORKSPACE_PATH:-/tmp/llm-wiki-workspace-not-set}:/workspace
      # TLS certificates — uncomment if WIKI_MCP_TLS_CERT_PATH is set
      #- ${WIKI_MCP_CERTS_DIR:-./certs}:/certs:ro
    environment:
      - WIKI_WORKSPACE_PATH=/workspace
      - WIKI_CONFIG_PATH=${WIKI_CONFIG_PATH:-}
      - WIKI_MCP_AUTH_TOKEN=${WIKI_MCP_AUTH_TOKEN:-}
      # HTTPS — set paths inside the container (e.g. /certs/server.crt) and uncomment the volume above
      - WIKI_MCP_TLS_CERT_PATH=${WIKI_MCP_TLS_CERT_PATH:-}
      - WIKI_MCP_TLS_KEY_PATH=${WIKI_MCP_TLS_KEY_PATH:-}
      - WIKI_MCP_TLS_CA_PATH=${WIKI_MCP_TLS_CA_PATH:-}
    ports:
      - '${WIKI_MCP_PORT:-3101}:3333'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # ── agent-wiki-production ─────────────────────────────────────────────────

  production-mcp:
    image: dotdrelle/agent-wiki-production:latest
    user: "${UID:-1000}:${GID:-1000}"
    labels:
      wiki-manager.description: "Production MCP server for ingest/build/export jobs."
    volumes:
      - ${WIKI_WORKSPACE_PATH:-/tmp/llm-wiki-workspace-not-set}:/workspace
    environment:
      - MCP_AUTH_TOKEN=${PRODUCTION_MCP_AUTH_TOKEN:-}
      - WORKSPACE_NAME=${WORKSPACE_NAME:-workspace}
      - WIKI_WORKSPACE_PATH=/workspace
      - WIKI_CONFIG_PATH=${WIKI_CONFIG_PATH:-}
      - PRODUCTION_ALLOWED_STEPS=${PRODUCTION_ALLOWED_STEPS:-doctor,ingest,ingest_plan,ingest_apply,build,export,polish,restore,pipeline}
      - PRODUCTION_REQUIRE_CONFIRMATION=${PRODUCTION_REQUIRE_CONFIRMATION:-false}
      # Parallelism levers — effective concurrency ≈ recommendedConcurrency.
      # Intermediate defaults (4/8). Low profile 2/4, high profile 8/16.
      # See docs/configuration.md § "Parallelism & throughput".
      - PRODUCTION_RECOMMENDED_CONCURRENCY=${PRODUCTION_RECOMMENDED_CONCURRENCY:-4}
      - PRODUCTION_MAX_CONCURRENCY=${PRODUCTION_MAX_CONCURRENCY:-8}
      - PRODUCTION_JOBS_DIR=${PRODUCTION_JOBS_DIR:-/workspace/.wiki/production-jobs}
      - PRODUCTION_LOCKS_DIR=${PRODUCTION_LOCKS_DIR:-/workspace/.wiki/production-jobs/locks}
    ports:
      - '${PRODUCTION_MCP_PORT:-3102}:8080'
    restart: unless-stopped

x-wiki-manager:
  service-aliases:
    all:
      targets: [serve, mcp-http, production-mcp]
      description: "Full workspace service set."
    ui:
      targets: [serve]
      description: "Chat, wiki browser and Donna's web UI."
    # Pas d'alias `wiki` ici : ce nom est deja celui d'un service Compose (le
    # CLI one-shot de `/wiki run`). L'alias le masquait, et `/start wiki`
    # demarrait mcp-http sans le dire.
    #
    # Pas d'alias `mcp` non plus : mcp-http fait partie du socle demarre par
    # `all` et `services`, personne ne le demarre seul. Il reste adressable
    # sous son nom Compose.
    production:
      targets: [production-mcp]
      description: "Ingest, build, export and polish jobs."
